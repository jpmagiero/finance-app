services:
  api:
    image: finance-api:local
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: file:/data/${DATABASE_FILE:-app.sqlite}
      COOKIE_SECURE: "true"
      WEB_ORIGIN: https://${APP_HOST:-finance.localhost}
      OPENAPI_SERVER_URL: /api
    expose:
      - "3333"
    volumes:
      - finance_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  proxy:
    build:
      context: .
      target: web
    environment:
      APP_HOST: ${APP_HOST:-finance.localhost}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
  backup:
    image: finance-api:local
    environment:
      DATABASE_URL: file:/data/${DATABASE_FILE:-app.sqlite}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    command: ["node", "dist/db/backup.js", "--loop"]
    volumes:
      - finance_data:/data:ro
      - finance_backups:/backups
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  finance_data:
  finance_backups:
  caddy_data:
  caddy_config:
